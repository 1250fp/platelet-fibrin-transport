[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platelet-fibrin-transport"
version = "0.1.0"
description = "Research mechanics and frozen-state transport in layered platelet-fibrin networks"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14", "matplotlib>=3.9", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["program19_core*"]
